<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <style>
    .linear{
    height: 400px;
    background: linear-gradient(orange,white, green);
    display: flex;
    justify-content: center;
    align-items: center;
}
.radial{
    height: 800px;
    background: radial-gradient(circle,black,red,green,blue,yellow);

}
.conic{
    height: 500px;
    background: conic-gradient(from 90deg,red,yellow,blue,green);
}
        </style>

</head>
<body>
    <div class="linear">
        <h1>Welcome to India</h1>
    </div>
    <div class="radial"></div>
    <div class="conic"></div>
</body>
</html>
