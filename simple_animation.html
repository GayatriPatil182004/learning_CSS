<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 150px;
            height: 150px;
            background-color: aqua;
            position: relative;
            border-radius: 50%;
            animation: movingcircle;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            animation-delay: 5s;
            animation-direction: alternate;


        }
        @keyframes movingcircle{
            0%{background-color: yellow;left:0px;top:0px}
            25%{background-color: red;left:300px;top:0px}
            50%{background-color: orange;left:300px;top:200px}
            75%{background-color: yellow;left:0px;top:200px}
            100%{background-color: orange;left: 0px;top: 0px}
        }
    </style>
</head>
<body>
    <div>

    </div>
</body>
</html>
